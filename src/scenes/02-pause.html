<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Пауза — maseaaao</title>
    <link rel="stylesheet" href="./obs-scene.css" />
  </head>
  <body data-scene="pause">
    <main class="scene-viewport">
      <section class="scene-stage" aria-label="Сцена паузы">
        <div class="scene-shell">
          <div class="scene-layout scene-layout--default">
            <section
              class="hero-panel hero-panel--default"
              aria-label="Шапка сцены">
              <div class="hero-panel__copy">
                <div class="identity">
                  <h1 class="identity__status">💤 Пауза</h1>
                </div>
              </div>

              <aside
                class="hero-panel__top-donors"
                data-slot="top-donors"
                aria-label="Зона топ донатеров">
                <svg
                  class="slot-marker slot-marker--top-donors"
                  viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                  <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                  <path d="M4 22h16" />
                  <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                  <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                  <path d="M18 2H6v7a6 6 0 0 0 12 0V2z" />
                </svg>
              </aside>

              <aside class="hero-panel__qr" aria-label="QR-код maseaaao.tv">
                <div class="qr-frame">
                  <img
                    src="../../dist/assets/maseaaao.tv.jpeg"
                    alt="QR-код на сайт maseaaao.tv"
                    width="800"
                    height="800"
                    loading="eager"
                    fetchpriority="high"
                    decoding="async" />
                </div>
              </aside>
            </section>

            <aside
              class="panel panel--chat"
              data-slot="chat"
              aria-label="Зона чата">
              <svg
                class="slot-marker slot-marker--chat"
                viewBox="0 0 24 24"
                aria-hidden="true">
                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
              </svg>
            </aside>

            <div class="scene-side">
              <section
                class="panel panel--donations"
                data-slot="donations"
                aria-label="Зона донатов">
                <svg
                  class="slot-marker slot-marker--donations"
                  viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
                  <path d="M2 7h20v5H2z" />
                  <path d="M12 22V7" />
                  <path d="M12 7H7.5a2.5 2.5 0 1 1 2.24-3.62L12 7z" />
                  <path d="M12 7h4.5a2.5 2.5 0 1 0-2.24-3.62L12 7z" />
                </svg>
              </section>

              <section
                class="panel panel--alerts"
                data-slot="alerts"
                aria-label="Зона уведомлений">
                <svg
                  class="slot-marker slot-marker--alerts"
                  viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
                  <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./obs-scene.js"></script>
  </body>
</html>
