name: Pinned workspace toolchain
description: Node, pnpm, frozen dependencies and isolated local task cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/cache@v4
      with:
        path: .build-cache/turbo
        key: tasks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'turbo.json', 'tooling/run-tasks.mjs') }}-${{ github.sha }}
        restore-keys: |
          tasks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'turbo.json', 'tooling/run-tasks.mjs') }}-
