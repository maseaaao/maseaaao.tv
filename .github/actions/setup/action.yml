name: Pinned workspace toolchain
description: Pinned Bun with frozen workspace dependencies
runs:
  using: composite
  steps:
    - name: Install Bun extraction prerequisite
      shell: bash
      run: |
        if ! command -v unzip >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends unzip
        fi
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - name: Restore Bun downloads
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Restore task results
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}-
