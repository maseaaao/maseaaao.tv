name: Pinned workspace toolchain
description: Node, Bun, frozen dependencies and isolated local task cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: actions/cache@v4
      with:
        path: .build-cache/turbo
        key: tasks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', '.bun-version', 'bun.lock', 'turbo.json', 'tooling/run-tasks.mjs') }}-${{ github.sha }}
        restore-keys: |
          tasks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', '.bun-version', 'bun.lock', 'turbo.json', 'tooling/run-tasks.mjs') }}-
