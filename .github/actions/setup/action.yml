name: Pinned workspace toolchain
description: Pinned Node, Bun and frozen isolated dependencies with a download-only cache
inputs:
  cache-write:
    description: Allow this caller to save the Bun download cache after installation
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - uses: actions/cache/restore@v4
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', '.bun-version', 'bun.lock') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: actions/cache/save@v4
      if: inputs.cache-write == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', '.bun-version', 'bun.lock') }}
