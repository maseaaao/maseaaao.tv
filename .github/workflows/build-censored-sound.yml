name: Build censored sound asset

on:
  push:
    branches:
      - feat/add-censored-sound
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-censored-sound

      - name: Assemble and verify asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = [
              ".tmp/censored.000",
              ".tmp/censored.001",
              ".tmp/censored.002",
              ".tmp/censored.003",
              ".tmp/censored.part02",
              ".tmp/censored.006",
              ".tmp/censored.007a",
              ".tmp/censored.007b0",
              ".tmp/censored.007b1x",
              ".tmp/censored.007b2x",
              ".tmp/censored.007b3",
          ]
          encoded = "".join(Path(part).read_text().strip() for part in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "08f192b89c85c9334e0af6e7f2c86e08b218ad5f0849d8a665b926b098d5075a"
          if digest != expected:
              raise RuntimeError(f"Checksum mismatch: expected {expected}, got {digest}")

          output = Path("src/sounds/censored.mp3")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          PY

          rm -rf .tmp
          rm -f .github/workflows/build-censored-sound.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit assembled asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add censored sound asset"
          git push origin HEAD:feat/add-censored-sound
