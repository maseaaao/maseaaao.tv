name: Build censored sound asset

on:
  push:
    branches:
      - feat/add-censored-sound

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-censored-sound

      - name: Assemble asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/sounds
          cat .tmp/censored.part00 .tmp/censored.part01 .tmp/censored.part02 .tmp/censored.part03 | base64 --decode > src/sounds/censored.mp3
          echo "08f192b89c85c9334e0af6e7f2c86e08b218ad5f0849d8a665b926b098d5075a  src/sounds/censored.mp3" | sha256sum --check
          rm -rf .tmp
          rm -f .github/workflows/build-censored-sound.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit assembled asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add censored sound asset"
          git push origin HEAD:feat/add-censored-sound
