name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing bundle tag, e.g. v1.0.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Require an existing tag
        run: git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Critical packaging tests
        run: bun run test:releases
      - name: Build and test every product
        run: bun tooling/bundle-release.mjs --build "$RELEASE_TAG"
      - name: Pack the verified bundle
        run: bun tooling/bundle-release.mjs "$RELEASE_TAG"
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          body_path: build/release/${{ env.RELEASE_TAG }}/notes.md
          files: |
            build/release/${{ env.RELEASE_TAG }}/maseaaao-*.zip
            build/release/${{ env.RELEASE_TAG }}/SHA256SUMS
