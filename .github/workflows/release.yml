name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing bundle tag, e.g. v1.0.0"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: ./.github/actions/setup
        with:
          cache-write: true
      - name: Browser and fonts for widget/artwork builds
        run: |
          bun run browser:install --with-deps
          python -m pip install -r tooling/artwork/requirements-fonts.txt
      - name: Build and test every product
        run: python tooling/bundle-release.py --build "$RELEASE_TAG"
      - name: Pack the verified bundle
        run: python tooling/bundle-release.py "$RELEASE_TAG"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "build/release/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file notes.md \
            maseaaao-*.zip maseaaao-*.manifest.json SHA256SUMS
