name: Release independent tool
on:
  push:
    tags:
      [
        "stream-info-v*",
        "tuna-widget-v*",
        "obs-widgets-v*",
        "artwork-v*",
        "system-microphone-v*",
        "voice-stream-v*",
        "windows-integrations-v*",
        "website-v*",
      ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing product tag, e.g. stream-info-v1.3.3"
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate product and tag before building
        run: python tooling/package-release.py --validate "$RELEASE_TAG"
      - run: bun run test:releases
      - name: Test and build the selected product
        run: node tooling/release-product.mjs "$RELEASE_TAG"
      - run: python tooling/package-release.py "$RELEASE_TAG"
      - name: Create immutable draft for download verification
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite artifacts."
            exit 1
          fi
          release_dir="build/release/$RELEASE_TAG"
          assets=()
          for file in "$release_dir"/*; do
            if [[ "$(basename "$file")" != "notes.md" ]]; then assets+=("$file"); fi
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --title "$RELEASE_TAG" --notes-file "$release_dir/notes.md"
          gh release download "$RELEASE_TAG" --dir "build/downloaded/$RELEASE_TAG"
          python tooling/package-release.py --verify-download "$RELEASE_TAG"
