name: Deploy website
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release run ID containing the cloudflare-dist artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-website
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'maseaaao/maseaaao.tv' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve the successful Release build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'run_id must be a positive numeric GitHub Actions run ID.' >&2
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '
            select(.path == ".github/workflows/release.yml"
              and .head_branch == "main"
              and (.event == "push" or .event == "workflow_dispatch")
              and .status == "completed"
              and .conclusion == "success") | .head_sha')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Select a completed, successful Release run from main.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying Release run $SOURCE_RUN_ID, commit $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Download the selected build without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-dist
          path: ${{ runner.temp }}/cloudflare-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restore the original dist layout
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/cloudflare-artifact/cloudflare-dist.tar.gz" -C dist
      - name: Deploy the prebuilt web products
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret.' >&2; exit 1; }
          bun run deploy:website
