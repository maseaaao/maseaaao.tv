name: Update rendered stream banners

on:
  push:
    branches:
      - feat/blue-ivory-redesign
    paths:
      - scripts/cyber-site-render.mjs
      - scripts/browser.mjs
      - src/banners/banner.css
      - src/banners/*.html
      - dist/assets/brand.css
      - tests/**
      - .github/workflows/render-banners.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run browser:install
      - run: npm run render:twitch-banner
      - run: npm test
      - name: Commit refreshed banner exports
        shell: bash
        run: |
          git add src/banners/rendered/twitch-schedule.jpeg src/banners/rendered/youtube-schedule.jpeg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: regenerate upload-size banners"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
