name: Normalize historical release notes
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/backfill-release-notes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize:
    if: github.repository == 'maseaaao/maseaaao.tv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Backfill only published managed releases v23–v39
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/backfill-release-notes.ts
