name: Verify monorepo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run browser:install
      - run: python3 -m pip install -r tooling/artwork/requirements-fonts.txt
      - run: npm run verify:ui-renewal
      # Temporary audit tool: read the canonical output of Prettier on the CI runner.
      - name: Export formatter corrections for review
        if: failure()
        run: |
          npm run format
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const names = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' })
            .split('\0').filter(Boolean);
          for (const path of names) {
            if (!/\.(?:js|mjs|ts|vue|css|html|md|json|jsonc|yml)$/.test(path)) continue;
            console.log('AUDIT_FORMATTED=' + JSON.stringify({
              path, content: fs.readFileSync(path, 'utf8'),
            }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-tools
          path: |
            apps/stream-info/dist/*.html
            apps/tuna-widget/dist/*.html
            apps/obs-widgets/dist/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-and-artwork-preview
          if-no-files-found: warn
          path: |
            dist/**
            artwork/scenes/rendered/**
            artwork/banners/rendered/**
            artwork/twitch-description/rendered/**
            artwork/brand/rendered/website/**
            artwork/wallpapers/rendered/**
  companion-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prepare:companion-libs
      - run: npm run build --workspace integrations/companion/system-microphone
      - run: npm run build --workspace integrations/companion/voice-control
      - run: npm run package --workspace integrations/companion/system-microphone
      - run: npm run package --workspace integrations/companion/voice-control
      - name: Verify Companion archive contents and install payloads
        run: python integrations/companion/shared/test-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: companion-modules
          path: integrations/companion/*/*.tgz
