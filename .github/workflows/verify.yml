name: Verify monorepo
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      # Weekly verification executes tasks even when their inputs are unchanged.
      TURBO_FORCE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust checked-out workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: integrations/companion/*/packages.lock.json
      - run: bun run browser:install --with-deps
      - run: bun run full
      - run: bun run build:companion
      - run: bun run package:companion
      - run: bun run check
      - run: bun run test
      - run: git diff --check
      - run: bun run verify:companion
