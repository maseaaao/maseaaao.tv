name: Verify monorepo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run browser:install
      - run: npm run build:all
      - run: npm run check
      - run: npm run test:checks
      - name: Verify committed website publication
        run: git diff --exit-code -- dist apps/obs-widgets/dist apps/stream-info/dist apps/tuna-widget/dist apps/stream-info/streamerbot-import.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-tools
          path: |
            apps/stream-info/dist/*.html
            apps/tuna-widget/dist/*.html
            apps/obs-widgets/dist/**
  companion-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prepare:companion-libs
      - run: npm run build --workspace integrations/companion/system-microphone
      - run: npm run build --workspace integrations/companion/voice-control
      - run: npm run package --workspace integrations/companion/system-microphone
      - run: npm run package --workspace integrations/companion/voice-control
      - name: Verify Companion archive contents and install payloads
        run: python integrations/companion/shared/test-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: companion-modules
          path: integrations/companion/*/*.tgz
