<!doctype html>
<html lang="ru">
  <head
    ><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Эталон Stream Info</title><link rel="stylesheet" href="reference.css"></head
  >
  <body class="dock-page"
    ><main class="dock-shell">
      <header class="dock-header"
        ><div
          ><h1>Stream Info</h1
          ><p class="connection"><span class="dot" aria-hidden="true"></span>Подключено</p></div
        ><button class="icon-button" type="button" aria-label="Настройки" aria-disabled="true"
          >⚙</button
        ></header
      >
      <section class="dock-section"
        ><h2>Название трансляции</h2
        ><label class="field">Тема стрима<input readonly value="Проходим новую игру"></label
        ><p class="preview-title">🔴 Проходим новую игру | !tg !yt !tw !donate</p></section
      >
      <section class="dock-section"
        ><h2>Категория и теги</h2
        ><div class="category"
          ><img
            class="category-cover"
            src="fixtures/just-chatting.jpg"
            alt=""
            width="48"
            height="64"
          ><div class="category-name"><strong>Just Chatting</strong></div
          ><button class="text-action" type="button" aria-disabled="true">Изменить</button></div
        ><label class="field"
          >Добавить тег<input readonly placeholder="Например, Русский"></label
        ><!-- biome-ignore lint/a11y/useSemanticElements: Tags form a named non-form group; fieldset would add unrelated form semantics. --><div
          class="tag-list"
          role="group"
          aria-label="Выбранные теги"
          ><span class="tag">Русский <span aria-hidden="true">×</span></span
          ><span class="tag">Общение <span aria-hidden="true">×</span></span></div
        ></section
      >
      <section class="dock-section"
        ><h2>Пресеты</h2
        ><button class="button" type="button" aria-disabled="true">Общение</button></section
      >
      <div class="save-area"
        ><p class="notice notice-warning" role="status">Есть несохранённые изменения</p
        ><button class="button button-primary" type="button" aria-disabled="true"
          >Применить изменения</button
        ></div
      >
      <footer class="dock-footer"
        ><span>Stream Info 1.4.0</span><span>Обновлено в 19:42</span></footer
      >
    </main></body
  >
</html>
