<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Stream Checker</title>
    <meta name="theme-color" content="#f4f3ec" />
    <link rel="icon" href="favicon.ico" />

    <script src="assets/theme.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/theme.css" />
  </head>

  <body class="checker">
    <header>
      <h1>Stream Checker</h1>

      <details class="theme-control" data-theme-control hidden>
            <summary class="theme-trigger" aria-label="Цветовая тема: системная" title="Изменить тему"><svg data-theme-icon="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><svg data-theme-icon="light" hidden viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg data-theme-icon="dark" hidden viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg></summary>
            <div class="theme-menu" role="group" aria-label="Цветовая тема">
              <button type="button" class="theme-choice" data-theme-value="auto" aria-label="Системная тема" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Системная тема</span><svg class="theme-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4 10-10"/></svg></button>
              <button type="button" class="theme-choice" data-theme-value="light" aria-label="Светлая тема" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Светлая тема</span><svg class="theme-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4 10-10"/></svg></button>
              <button type="button" class="theme-choice" data-theme-value="dark" aria-label="Тёмная тема" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg><span>Тёмная тема</span><svg class="theme-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4 10-10"/></svg></button>
            </div>
          </details>
      <div class="global-actions">
        <button type="button" data-action="add-all">Добавить все</button>
        <button type="button" data-action="remove-all" data-kind="remove"
          >Удалить все</button
        >
      </div>
    </header>

    <main class="grid">
      <section class="card" data-platform="youtube">
        <div class="card-header">
          <div>
            <div class="title">YouTube</div>
            <div class="status" data-status>iframe не создан</div>
          </div>

          <div class="actions">
            <button type="button" data-action="add">Добавить</button>
            <button type="button" data-action="remove" data-kind="remove"
              >Удалить</button
            >
            <a
              class="button"
              href="https://www.youtube.com/channel/UCyJNPWpOcPfMo5csKa27yGg/live"
              target="_blank"
              rel="noreferrer"
              >Открыть</a
            >
          </div>
        </div>

        <div class="slot" data-slot>
          <div class="placeholder">YouTube-плеер не загружен</div>
        </div>
      </section>

      <section class="card" data-platform="twitch">
        <div class="card-header">
          <div>
            <div class="title">Twitch</div>
            <div class="status" data-status>iframe не создан</div>
          </div>

          <div class="actions">
            <button type="button" data-action="add">Добавить</button>
            <button type="button" data-action="remove" data-kind="remove"
              >Удалить</button
            >
            <a
              class="button"
              href="https://www.twitch.tv/maseaaao"
              target="_blank"
              rel="noreferrer"
              >Открыть</a
            >
          </div>
        </div>

        <div class="slot" data-slot>
          <div class="placeholder">Twitch-плеер не загружен</div>
        </div>
      </section>
    </main>

    <script>
      const SEARCH_PARAMS = new URLSearchParams(window.location.search);
      const IS_TV_MODE = SEARCH_PARAMS.get("tv") === "1";

      if (IS_TV_MODE) {
        document.body.classList.add("is-tv-mode");
      }

      const STREAMS = {
        youtube: {
          title: "YouTube live",
          get src() {
            const params = new URLSearchParams({
              channel: "UCyJNPWpOcPfMo5csKa27yGg",
              autoplay: "1",
              mute: IS_TV_MODE ? "0" : "1",
            });

            return `https://www.youtube.com/embed/live_stream?${params.toString()}`;
          },
          allow: "autoplay; encrypted-media; picture-in-picture; fullscreen",
        },

        twitch: {
          title: "Twitch live",
          get src() {
            const parent = window.location.hostname;

            if (!parent) {
              throw new Error("Twitch iframe requires a real hostname.");
            }

            const params = new URLSearchParams({
              channel: "maseaaao",
              parent,
              autoplay: "true",
              muted: "true",
            });

            return `https://player.twitch.tv/?${params.toString()}`;
          },
          allow: "autoplay; fullscreen",
        },
      };

      function getElements(platform) {
        const card = document.querySelector(`[data-platform="${platform}"]`);

        return {
          card,
          slot: card.querySelector("[data-slot]"),
          status: card.querySelector("[data-status]"),
        };
      }

      function setPlaceholder(slot, platform) {
        const label = {
          youtube: "YouTube-плеер не загружен",
          twitch: "Twitch-плеер не загружен",
        }[platform];

        slot.replaceChildren(
          Object.assign(document.createElement("div"), {
            className: "placeholder",
            textContent: label,
          }),
        );
      }

      function setError(slot, status, message) {
        slot.replaceChildren(
          Object.assign(document.createElement("div"), {
            className: "placeholder",
            textContent: message,
          }),
        );

        status.textContent = "ошибка";
      }

      function addPlayer(platform) {
        const config = STREAMS[platform];
        const { slot, status } = getElements(platform);

        if (slot.querySelector("iframe")) {
          status.textContent = "iframe уже создан";
          return;
        }

        try {
          const iframe = document.createElement("iframe");

          iframe.title = config.title;
          iframe.src = config.src;
          iframe.allow = config.allow;
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "strict-origin-when-cross-origin";

          slot.replaceChildren(iframe);
          status.textContent = "iframe создан";
        } catch (error) {
          setError(
            slot,
            status,
            error instanceof Error
              ? error.message
              : "Не удалось создать iframe",
          );
        }
      }

      function removePlayer(platform) {
        const { slot, status } = getElements(platform);

        slot.replaceChildren();
        setPlaceholder(slot, platform);
        status.textContent = "iframe не создан";
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");

        if (!button) {
          return;
        }

        const action = button.dataset.action;
        const card = button.closest("[data-platform]");
        const platforms = Object.keys(STREAMS);

        if (action === "add-all") {
          platforms.forEach(addPlayer);
          return;
        }

        if (action === "remove-all") {
          platforms.forEach(removePlayer);
          return;
        }

        if (!card) {
          return;
        }

        const platform = card.dataset.platform;

        if (action === "add") {
          addPlayer(platform);
        }

        if (action === "remove") {
          removePlayer(platform);
        }
      });

      if (IS_TV_MODE) {
        Object.keys(STREAMS).forEach(addPlayer);
      }
    </script>
  </body>
</html>
