<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta content="light" name="color-scheme">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="noindex,follow" name="robots">
    <title>Stream Checker</title>
    <meta content="#f4f3ec" name="theme-color">
    <link href="favicon.ico?v=rounded-1" rel="icon">
    <link href="assets/design.css" rel="stylesheet">
    <link href="assets/site.css" rel="stylesheet">
  </head>

  <body class="checker">
    <header>
      <h1>Stream Checker</h1>
      <div class="global-actions">
        <button
          class="app-button app-button--secondary app-button--inverted app-button--press"
          data-action="add-all"
          type="button"
        >
          <span class="app-button__label">Загрузить все плееры</span>
        </button><button
          class="app-button app-button--secondary app-button--inverted app-button--press"
          data-action="remove-all"
          data-kind="remove"
          type="button"
        >
          <span class="app-button__label">Убрать все плееры</span>
        </button>
      </div>
    </header>
    <main class="grid">
      <section class="card" data-platform="youtube">
        <div class="card-header">
          <div>
            <h2 class="title">YouTube</h2>
            <div class="status" data-status role="status">Плеер не загружен</div>
          </div>
          <div class="actions">
            <button
              class="app-button app-button--secondary app-button--press"
              data-action="add"
              type="button"
            >
              <span class="app-button__label">Загрузить плеер</span>
            </button><button
              class="app-button app-button--secondary app-button--press"
              data-action="remove"
              data-kind="remove"
              type="button"
            >
              <span class="app-button__label">Убрать плеер</span>
            </button><a
              class="app-button app-button--secondary app-button--press button"
              href="https://www.youtube.com/channel/UCyJNPWpOcPfMo5csKa27yGg/live"
              rel="noreferrer"
              target="_blank"
              ><span class="app-button__label">Открыть на платформе</span></a
            >
          </div>
        </div>
        <div class="slot" data-slot><div class="placeholder">YouTube-плеер не загружен</div></div>
      </section>
      <section class="card" data-platform="twitch">
        <div class="card-header">
          <div>
            <h2 class="title">Twitch</h2>
            <div class="status" data-status role="status">Плеер не загружен</div>
          </div>
          <div class="actions">
            <button
              class="app-button app-button--secondary app-button--press"
              data-action="add"
              type="button"
            >
              <span class="app-button__label">Загрузить плеер</span>
            </button><button
              class="app-button app-button--secondary app-button--press"
              data-action="remove"
              data-kind="remove"
              type="button"
            >
              <span class="app-button__label">Убрать плеер</span>
            </button><a
              class="app-button app-button--secondary app-button--press button"
              href="https://www.twitch.tv/maseaaao"
              rel="noreferrer"
              target="_blank"
              ><span class="app-button__label">Открыть на платформе</span></a
            >
          </div>
        </div>
        <div class="slot" data-slot><div class="placeholder">Twitch-плеер не загружен</div></div>
      </section>
    </main>
    <script src="assets/check.ts" type="module"></script>
  </body>
</html>
