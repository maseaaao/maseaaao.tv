<!doctype html>
<html lang="ru">
  <head>
    <title>Tuna — maseaaao</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body>
    <main aria-label="Музыкальный виджет" data-cover="0" data-play="0" id="player">
      <div aria-hidden="true" id="surface"></div>
      <img alt="" aria-hidden="true" class="artwork-glow">
      <img alt="" aria-hidden="true" class="artwork-glow">
      <div aria-hidden="true" id="cover-frame">
        <div id="cover-fallback">
          <svg
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </div>
        <img alt="" class="cover-image" id="cover-a">
        <img alt="" class="cover-image" id="cover-b">
      </div>
      <section id="content">
        <div class="track-text" id="track-text">
          <div class="track-title" id="title"></div>
          <div class="track-subtitle" hidden id="subtitle"></div>
        </div>
      </section>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
