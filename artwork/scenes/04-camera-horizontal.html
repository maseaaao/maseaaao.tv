<!doctype html>
<html lang="ru">

    <main aria-label="Оформление сцены" class="canvas camera" style="width:2560px;height:1440px;">
      <div

      <div
        aria-hidden="true"
        class="zone"
        data-zone="chat"

        aria-hidden="true"
        class="zone"

        aria-hidden="true"
        class="zone"

        aria-hidden="true"

      <img
        alt="QR: maseaaao.tv"
        class="qr"
        data-zone="qr"
        src="../../apps/website/public/assets/maseaaao.tv.png"
        style="left:2180px;top:1160px;width:250px;height:250px;"
      >
    </main>
