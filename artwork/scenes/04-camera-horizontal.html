<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>maseaaao — 04-camera-horizontal</title>
    <link href="../styles.css" rel="stylesheet">
  </head>
  <body>
    <main aria-label="Оформление сцены" class="canvas camera" style="width:2560px;height:1440px;">
      <div
        aria-hidden="true"
        class="camera-frame"
        data-zone="camera"
        style="left:32px;top:32px;width:2496px;height:1376px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="chat"
        style="left:1740px;top:330px;width:640px;height:640px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="music"
        style="left:1740px;top:1010px;width:640px;height:128px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="donors"
        style="left:120px;top:1200px;width:1100px;height:147.4px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="alerts"
        style="left:120px;top:824px;width:1100px;height:366.67px;"
      ></div>
      <img
        alt="QR: maseaaao.tv"
        class="qr"
        data-zone="qr"
        src="../../apps/website/public/assets/maseaaao.tv.png"
        style="left:2180px;top:1160px;width:250px;height:250px;"
      >
    </main>
  </body>
</html>
