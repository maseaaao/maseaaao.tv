<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>maseaaao — 04-camera-vertical</title>
    <link href="../styles.css" rel="stylesheet">
  </head>
  <body>
    <main
      aria-label="Оформление сцены"
      class="canvas camera vertical"
      style="width:1080px;height:1920px;"
    >
      <div
        aria-hidden="true"
        class="lower-background"
        style="left:0px;top:608px;width:1080px;height:1312px;"
      ></div>
      <div
        aria-hidden="true"
        class="camera-frame"
        data-zone="camera"
        style="left:0px;top:0px;width:1080px;height:608px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone panel"
        data-zone="chat"
        style="left:120px;top:704px;width:720px;height:600px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="music"
        style="left:120px;top:1344px;width:720px;height:144px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="donors"
        style="left:120px;top:1344px;width:720px;height:96.48px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="alerts"
        style="left:120px;top:1510px;width:720px;height:240px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="social"
        style="left:0px;top:608px;width:1080px;height:64px;"
      ></div>
    </main>
  </body>
</html>
