<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>maseaaao — 99-end-vertical</title>
    <link href="../styles.css" rel="stylesheet">
  </head>
  <body>
    <main aria-label="конец" class="canvas status vertical" style="width:1080px;height:1920px;">
      <div
        aria-hidden="true"
        class="header-rule"
        style="left:120px;top:244px;width:720px;height:1px;"
      ></div>
      <div
        aria-hidden="true"
        class="title-field"
        style="left:88px;top:268px;width:784px;height:176px;"
      ></div>
      <h1 style="left:120px;top:300px;font-size:88px;">конец</h1>
      <div
        aria-hidden="true"
        class="zone panel"
        data-zone="chat"
        style="left:120px;top:636px;width:720px;height:524px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="music"
        style="left:120px;top:1260px;width:720px;height:144px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="donors"
        style="left:120px;bottom:1284px;width:720px;height:96.48px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="alerts"
        style="left:428px;top:1565px;width:612px;height:204px;"
      ></div>
      <div
        aria-hidden="true"
        class="zone"
        data-zone="social"
        style="left:120px;top:1160px;width:720px;height:88px;"
      ></div>
      <img
        alt="QR: maseaaao.tv"
        class="qr"
        data-zone="qr"
        src="../../apps/website/public/assets/maseaaao.tv.png"
        style="left:120px;top:1540px;width:260px;height:260px;"
      >
    </main>
  </body>
</html>
