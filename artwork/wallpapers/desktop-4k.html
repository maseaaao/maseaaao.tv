              values="0 0 0 0 .956863 0 0 0 0 .952941 0 0 0 0 .92549 .2126 .7152 .0722 0 0" />

              <feFuncA type="linear" slope="1.7" intercept="-.45" />

        <image
          href="../logo/logo.png"
          width="1024"
          height="1024"
          filter="url(#letter)" /></svg
      ></main
    ></body
