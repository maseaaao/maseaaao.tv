<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>maseaaao — desktop-4k</title>
    <link href="../styles.css" rel="stylesheet">
  </head>
  <body>
    <main aria-label="maseaaao" class="wallpaper-artwork">
      <svg aria-hidden="true" class="wallpaper-icon" viewBox="0 0 1024 1024">
        <defs>
          <filter color-interpolation-filters="sRGB" id="letter">
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 .956863 0 0 0 0 .952941 0 0 0 0 .92549 .2126 .7152 .0722 0 0"
            ></feColorMatrix>
            <feComponentTransfer>
              <feFuncA intercept="-.45" slope="1.7" type="linear"></feFuncA>
            </feComponentTransfer>
          </filter>
        </defs>
        <image filter="url(#letter)" height="1024" href="../logo/logo.png" width="1024"></image>
      </svg>
    </main>
  </body>
</html>
